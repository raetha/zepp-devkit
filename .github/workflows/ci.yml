name: CI

# Every push and pull request: shellcheck, the scripts' tests (a fake Zeus, no network),
# and the Python tools compile.

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: shellcheck
        run: shellcheck -x zepp_devkit/preview/*.sh test/*.sh

      - name: Python compiles
        run: python3 -m py_compile zepp_devkit/*.py zepp_devkit/*/*.py

      - name: Package tests
        run: |
          pip install -e . pytest
          pytest -q tests

      - name: The emulator tool parses
        run: node --check zepp_devkit/emu/emu.mjs

      - name: Preview script tests
        run: bash test/preview.test.sh

      - name: The setup action finds the scripts
        uses: ./setup

      - name: ZEPP_DEVKIT points here, and the command works
        run: |
          test -f "$(zepp-devkit path)/preview/zeus_preview.sh"
          zepp-devkit path
